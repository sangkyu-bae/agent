[project]
name = "idt"
version = "0.1.0"
description = "FastAPI + LangGraph/LangChain RAG & Agent System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    # LangChain / LangGraph
    # builtin-middleware S1: create_agent + 빌트인 미들웨어 (v1 필수)
    "langchain>=1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    # uuid-utils 0.17.0 네이티브 확장(_uuid_utils.pyd)이 Windows Smart App Control
    # (평판 미확보 미서명 바이너리)에 차단되어 langchain-core import 가 실패한다.
    # 평판이 확보된 0.16.x 로 고정한다. (langchain-core/langsmith 요구: >=0.12.0,<1.0)
    "uuid-utils>=0.12.0,<0.17.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncmy>=0.2.9",
    "alembic>=1.13.0",
    # Vector DB
    "qdrant-client>=1.13.0",
    # HTTP
    "httpx>=0.26.0",
    # PDF Parsing
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "llama-parse>=0.4.0",
    # Tokenization
    "tiktoken>=0.5.0",
    # LLM Client
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    # MCP (Model Context Protocol)
    # mcp 2.0에서 streamablehttp_client -> streamable_http_client 로 rename (breaking).
    # client_factory.py 가 구버전 심볼을 사용하므로 1.x 로 고정한다.
    "mcp>=1.0.0,<2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    # Elasticsearch
    "elasticsearch[async]==8.10.1",
    # Korean Morphological Analyzer
    "kiwipiepy>=0.17.0",
    # HTML to PDF
    "xhtml2pdf>=0.2.17",
    # Excel
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    # Web Search
    "tavily-python>=0.3.0",
    # Redis
    "redis>=5.0.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5.0",
    "python-multipart>=0.0.9",
    # Crypto (MCP 등록 시크릿 Fernet 암호화 — secret_cipher.py 직접 사용)
    "cryptography>=42.0.0",
    # Cron 표현식 파싱/다음 발화 계산 (agent-schedule)
    "croniter>=2.0",
    # IANA tz DB (runtime-datetime-context D11) — Windows/슬림 컨테이너엔 OS tz DB가 없어
    # ZoneInfo("Asia/Seoul")가 ZoneInfoNotFoundError. 전이 의존에 기대지 않고 명시.
    "tzdata>=2024.1",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
# RAGAS 평가 (ragas_adapter.py / agent-model-benchmark 품질 축).
# 임포트가 전부 함수 내부라 미설치 상태에서도 앱은 기동하며, 품질 지표만 비게 된다.
#
# ⚠️ base 의존성에 넣지 않은 이유: ragas 0.4.x 는 openai<3 을 요구해
#    현재 고정된 openai 3.x 를 메이저 다운그레이드시킨다. langchain-openai 의
#    허용 범위(>=2.45,<4) 안이긴 하나 LLM 스택 전체에 영향이 가므로,
#    품질 축을 실측할 환경에서만 `uv pip install -e ".[eval]"` 로 켠다.
eval = [
    "ragas>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    # tool-recommender Design §8.1 — 실 LLM을 호출하는 평가 테스트. CI 제외 대상.
    # 실행: pytest -m llm  /  기본 실행에서는 addopts로 자동 제외된다.
    "llm: requires a live LLM call (excluded by default)",
]
# 기본 `pytest`는 실 LLM 테스트를 건너뛴다 — 비용·네트워크 의존 때문.
# CLI의 -m 이 이 값을 덮어쓰므로 `pytest -m llm`으로 명시 실행할 수 있다.
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
